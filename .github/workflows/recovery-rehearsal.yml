name: Local Worker recovery rehearsal

on:
  pull_request:
    paths:
      - "onboarding/**"
      - "pipeline/**"
      - "scripts/worker-recovery/**"
      - "package.json"
      - ".github/workflows/recovery-rehearsal.yml"
  push:
    branches: [main]
    paths:
      - "onboarding/**"
      - "pipeline/**"
      - "scripts/worker-recovery/**"
      - ".github/workflows/recovery-rehearsal.yml"

permissions:
  contents: read

jobs:
  local-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install pinned test-only Worker runtime
        run: npm ci --prefix scripts/worker-recovery
      - name: Rehearse local D1 and Worker launch recovery
        run: npm run qa:rehearse:recovery
